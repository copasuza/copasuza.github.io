name: Fix public bracket winner dialog
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/fix-public-bracket.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove public winner prompts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = "document.getElementById('sf1').onclick=()=>{if(winners[1]&&winners[2]){winners.sf1=prompt('برنده نیمه‌نهایی ۱ را انتخاب کنید:',winners[1])===winners[2]?winners[2]:winners[1];renderBracket();}};"
          old2 = "document.getElementById('sf2').onclick=()=>{if(winners[3]&&winners[4]){winners.sf2=prompt('برنده نیمه‌نهایی ۲ را انتخاب کنید:',winners[3])===winners[4]?winners[4]:winners[3];renderBracket();}};"
          new1 = "document.getElementById('sf1').onclick=null;"
          new2 = "document.getElementById('sf2').onclick=null;"
          if old1 not in s or old2 not in s:
              raise SystemExit('target prompt code not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Disable public semifinal winner prompts'
          git push