name: Disable public bracket prompts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: disable public bracket prompts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable public winner-selection dialogs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script>window.__copaPublicNoPrompt=1;window.prompt=function(){return null};</script>'
          if marker not in s:
              if '</body>' not in s:
                  raise SystemExit('body closing tag not found')
              s = s.replace('</body>', marker+'</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/disable-public-bracket-prompts.yml
          git commit -m "fix: disable public bracket prompts"
          git push
