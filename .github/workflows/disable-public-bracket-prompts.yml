name: Disable public bracket prompts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: disable public bracket prompts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable public winner-selection interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = "document.getElementById('sf1').onclick=()=>{if(winners[1]&&winners[2]){winners.sf1=prompt('برنده نیمه‌نهایی ۱ را انتخاب کنید:',winners[1])===winners[2]?winners[2]:winners[1];renderBracket();}};"
          old2 = "document.getElementById('sf2').onclick=()=>{if(winners[3]&&winners[4]){winners.sf2=prompt('برنده نیمه‌نهایی ۲ را انتخاب کنید:',winners[3])===winners[4]?winners[4]:winners[3];renderBracket();}};"
          new1 = "document.getElementById('sf1').onclick=()=>{};"
          new2 = "document.getElementById('sf2').onclick=()=>{};"
          changed = False
          if old1 in s:
              s = s.replace(old1,new1,1); changed = True
          if old2 in s:
              s = s.replace(old2,new2,1); changed = True
          if not changed:
              raise SystemExit('winner prompt handlers not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/disable-public-bracket-prompts.yml
          git commit -m "fix: disable public bracket prompts"
          git push
