name: Hide finished matches from schedule

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update schedule rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const sch=data.schedule||[],sl=document.getElementById('schedule-list');"
          new = "const schAll=data.schedule||[],sch=schAll.filter(x=>x.homeScore==null&&x.awayScore==null&&x.iso&&Date.parse(x.iso)>Date.now()),sl=document.getElementById('schedule-list');"
          if old not in s:
              raise SystemExit('target code not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: hide finished matches from schedule"
          git push
