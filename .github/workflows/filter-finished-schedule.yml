name: Fix public site scorer source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix scorer rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const scorerMap={};(data.scorers||[]).forEach(x=>{const key=(x.name||'')+'||'+(x.team||'');if(key!=='||')scorerMap[key]={name:x.name,team:x.team,goals:Number(x.goals||0)}});matches.filter(m=>m.stage&&m.stage!=='group').forEach(m=>[['homeScorers',m.home],['awayScorers',m.away]].forEach(([k,team])=>(m[k]||'').split(/\\n|،|,/).map(x=>x.trim()).filter(Boolean).forEach(name=>{const key=name+'||'+team;if(scorerMap[key])scorerMap[key].goals++})));const sc=Object.values(scorerMap).slice().sort((a,b)=>(b.goals||0)-(a.goals||0)).slice(0,10)"
          new = "const scorerMap={};(data.scorers||[]).forEach(x=>{const key=(x.name||'')+'||'+(x.team||'');if(key!=='||')scorerMap[key]={name:x.name,team:x.team,goals:Number(x.goals||0)}});const sc=Object.values(scorerMap).slice().sort((a,b)=>(b.goals||0)-(a.goals||0)).slice(0,10)"
          if old not in s:
              raise SystemExit('scorer target code not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/filter-finished-schedule.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/filter-finished-schedule.yml
          git commit -m "fix: use admin scorer list only"
          git push
