name: Fix hero year
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/workflows/fix-hero-year.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicated year and mobile layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="name.replace(/\\s*(۲۰\\d\\d|20\\d\\d)\\s*$/,'').trim()"
          new="name.replace(/\\s*[0-9۰-۹]{4}\\s*$/,'').trim()"
          if old in s:
              s=s.replace(old,new)
          fix="""\n@media(max-width:620px){\n  html,body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}\n  .topbar,.topin,.wrap{width:100vw;max-width:100vw;margin-left:0;margin-right:0}\n  .topin{box-sizing:border-box}\n}\n"""
          if fix.strip() not in s:
              marker='</style>'
              if marker not in s:
                  raise SystemExit('style marker not found')
              s=s.replace(marker,fix+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix mobile layout width' && git push
