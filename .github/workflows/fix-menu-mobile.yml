name: Fix mobile hamburger menu

on:
  push:
    paths:
      - 'menu-fix-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile menu visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.site-menu{width:min(270px,calc(100vw - 18px));max-height:calc(100dvh - 100px);overflow-y:auto;overscroll-behavior:contain}'
          new = '.site-menu{position:fixed;top:73px;right:9px;width:min(300px,calc(100vw - 18px));max-height:calc(100dvh - 82px);overflow-y:auto;overscroll-behavior:contain;z-index:9999;-webkit-overflow-scrolling:touch}'
          if old not in s:
              raise SystemExit('target CSS not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'copasuza'
          git config user.email 'adnan.dakhoda5@gmail.com'
          git add index.html
          git commit -m 'Fix mobile hamburger menu visibility'
          git push
          git rm .github/workflows/fix-menu-mobile.yml menu-fix-trigger.txt
          git commit -m 'Remove temporary menu fix workflow'
          git push
