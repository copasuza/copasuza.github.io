name: Apply Copa Suza mobile layout fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'chore: apply mobile layout fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mobile layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          fix = """\n@media(max-width:620px){\n  html,body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}\n  .topbar,.topin,.wrap{width:100vw;max-width:100vw;margin-left:0;margin-right:0}\n  .topin{box-sizing:border-box}\n}\n"""
          if fix.strip() not in s:
              marker = '</style>'
              if marker not in s:
                  raise SystemExit('style marker not found')
              s = s.replace(marker, fix + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Mobile layout fix already present')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-semifinals.yml mobile-layout-trigger.txt
          git add index.html .github/workflows/update-semifinals.yml mobile-layout-trigger.txt
          git diff --cached --quiet || git commit -m "chore: apply mobile layout fix"
          git push
