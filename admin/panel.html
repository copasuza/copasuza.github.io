<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریتی کوپا سوزا</title>
<style>
:root{--bg:#06110d;--side:#081a13;--card:#0c241b;--line:#28513e;--gold:#e2c15d;--text:#f3f7f4;--muted:#a7b8b0;--active:#1b4d39;--soft:#102b20}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#123c2b 0,#06110d 38%,#040c09 100%);color:var(--text);font-family:Tahoma,Vazirmatn,sans-serif;height:100vh;height:100dvh;overflow:hidden}.shell{height:100vh;height:100dvh;display:flex;flex-direction:column}.head{height:70px;flex:0 0 70px;background:linear-gradient(90deg,#0b241a,#081a13);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:relative;z-index:5;box-shadow:0 4px 20px #0005}.brand{display:flex;align-items:center;gap:12px}.brand .ball{font-size:31px;filter:drop-shadow(0 2px 4px #0008)}.brand strong{color:var(--gold);font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.head-actions{display:flex;gap:9px;align-items:center}.view{display:inline-flex;align-items:center;text-decoration:none;color:#f1f6f3;background:var(--soft);border:1px solid #39644f;padding:10px 15px;border-radius:10px;font-weight:700;font-size:13px;transition:.2s}.view:hover{background:#17402f;border-color:var(--gold)}.toggle{display:none;border:1px solid var(--line);background:#10291f;color:var(--gold);border-radius:10px;padding:8px 11px;font-size:19px}.body{display:flex;min-height:0;flex:1}.side{width:250px;flex:0 0 250px;background:linear-gradient(180deg,#091c15,#071610);border-left:1px solid var(--line);padding:17px 11px;overflow:auto;box-shadow:8px 0 30px #0003}.side-title{color:#849b90;font-size:11px;font-weight:700;padding:6px 12px 9px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:#e0ebe5;text-align:right;padding:13px 14px;border-radius:11px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:.18s}.nav button span{font-size:17px;width:22px;text-align:center}.nav button:hover{background:#102b20;border-color:#244936}.nav button.active{background:linear-gradient(90deg,#1c4e39,#143a2b);border-color:#d6b650;color:var(--gold);font-weight:800;box-shadow:0 5px 16px #0003}.divider{height:1px;background:#1b3a2d;margin:12px 6px}.content{min-width:0;flex:1;position:relative;background:transparent}iframe{border:0;width:100%;height:100%;display:block;background:transparent}.mobile-shade{display:none}
@media(max-width:800px){.head{height:62px;flex-basis:62px;padding:0 12px}.toggle{display:block}.head .view{display:none}.side{position:absolute;z-index:20;right:0;top:62px;bottom:0;width:270px;transform:translateX(105%);transition:.22s;box-shadow:-12px 0 40px #0009}.side.open{transform:translateX(0)}.mobile-shade{position:absolute;inset:62px 0 0;background:#0009;z-index:19}.mobile-shade.show{display:block}.brand strong{font-size:17px}.brand small{font-size:10px}}
</style>
</head>
<body>
<div class="shell">
<header class="head">
  <div class="brand"><span class="ball">⚽</span><div><strong>کوپا سوزا</strong><small>پنل مدیریت تورنمنت</small></div></div>
  <div class="head-actions"><a class="view" href="../" target="_blank">مشاهده سایت ↗</a><button class="toggle" id="menuToggle">☰</button></div>
</header>
<div class="body">
  <aside class="side" id="side">
    <div class="side-title">مدیریت تورنمنت</div>
    <div class="nav">
      <button data-tab="dashboard" class="active"><span>📊</span> داشبورد</button>
      <button data-tab="scorers"><span>🥇</span> گلزنان</button>
      <button data-tab="matches"><span>⚽</span> نتایج بازی‌ها</button>
      <button data-tab="schedule"><span>🗓️</span> برنامه مسابقات</button>
      <button data-tab="knockout"><span>🏆</span> مراحل حذفی</button>
      <div class="divider"></div>
      <div class="side-title">تیم‌ها و بازیکنان</div>
      <button data-tab="players"><span>👥</span> بانک تیم‌ها و بازیکنان</button>
      <button data-section="registration"><span>📋</span> ثبت‌نام تیم‌ها</button>
      <div class="divider"></div>
      <button data-tab="settings"><span>⚙️</span> تنظیمات</button>
    </div>
  </aside>
  <div class="mobile-shade" id="shade"></div>
  <main class="content"><iframe id="legacy" src="app.html?v=20261022-scoreselect3" title="پنل مدیریت کوپا سوزا"></iframe></main>
</div>
</div>
<script>
const frame=document.getElementById('legacy'),side=document.getElementById('side'),toggle=document.getElementById('menuToggle'),shade=document.getElementById('shade');
function closeMenu(){side.classList.remove('open');shade.classList.remove('show')}
toggle.onclick=()=>{side.classList.toggle('open');shade.classList.toggle('show')};shade.onclick=closeMenu;
function enhanceLegacy(){
 const d=frame.contentDocument;if(!d)return;
 d.querySelectorAll('.tabs').forEach(x=>x.style.display='none');
 d.body.style.overflow='auto';d.body.style.background='transparent';d.body.style.fontFamily='Tahoma,Vazirmatn,sans-serif';d.body.style.fontSize='15px';
 const style=d.createElement('style');
 style.textContent=`
   .wrap{max-width:none!important;padding:18px 22px!important}
   .card{background:linear-gradient(145deg,#0d281e,#0a1e16)!important;border-color:#2a5642!important;border-radius:16px!important;box-shadow:0 7px 22px #0004!important}
   .card h3{font-size:19px!important;color:#f0f5f2}
   .card h4{font-size:15px!important}
   .small{font-size:12px!important;color:#a7b8b0!important}
   .notice,.status{font-size:14px!important;line-height:1.9!important}
   .field label,.matchlabel,.ko-label{font-size:13px!important}
   .field input,.field select,.field textarea{font-size:15px!important;padding:11px!important}
   .btn{font-size:14px!important;padding:11px 16px!important}
   .matchrow{padding:16px 0 20px!important;margin-bottom:14px!important;border:1px solid #28513e!important;border-radius:14px!important;background:#0a2017!important;box-shadow:0 4px 14px #0003!important}
   .matchrow>*{margin-left:14px!important;margin-right:14px!important}
   .matchtop{font-size:14px!important;gap:9px!important}
   .matchextra{gap:12px!important;margin-top:14px!important}
   .matchhint,.ko-hint{font-size:13px!important}
   .reg-table th{font-size:13px!important}.reg-table td{font-size:14px!important}
   .roster-table th,.roster-table td{font-size:14px!important}
   .player-picker-row select{font-size:14px!important}
   .matchrow .scorers,.matchrow [class*="scorer"],.matchrow [id*="scorer"],.matchrow [id*="goal"]{order:-10}
   .matchrow .cards,.matchrow [class*="card"],.matchrow [id*="card"],.matchrow [class*="yellow"],.matchrow [class*="red"]{order:20}
   @media(max-width:800px){.matchtop{grid-template-columns:1fr 1fr!important}.matchextra{grid-template-columns:1fr!important}.matchrow>*{margin-left:10px!important;margin-right:10px!important}}
 `;
 d.head.appendChild(style);
 const wrap=d.querySelector('.wrap');if(wrap){wrap.style.maxWidth='none';wrap.style.padding='18px 22px'}
 const oldTop=d.querySelector('.wrap > .top');if(oldTop)oldTop.style.display='none';
 function tidyMatches(){
   d.querySelectorAll('.matchrow').forEach(row=>{
     const boxes=[...row.children];
     const scoreBoxes=boxes.filter(el=>/گلزن|گلزنان|scorer|goal/i.test(el.textContent||''));
     const cardBoxes=boxes.filter(el=>/کارت|زرد|قرمز|card|yellow|red/i.test(el.textContent||''));
     scoreBoxes.forEach(el=>{el.style.order='-10'});
     cardBoxes.forEach(el=>{el.style.order='20'});
   });
 }
 function bindMatchSaveButtons(){
   d.querySelectorAll('button').forEach(btn=>{
     if(!/ثبت\s*مسابقه/.test(btn.textContent||''))return;
     if(btn.classList.contains('match-save'))return;
     if(btn.dataset.copaSaveBound)return;
     btn.dataset.copaSaveBound='1';
     btn.addEventListener('click',function(e){
       e.preventDefault();
       e.stopImmediatePropagation();
       const win=d.defaultView;
       if(win && typeof win.saveToGitHub==='function'){
         const status=d.getElementById('status')||d.getElementById('tournamentStatus');
         win.saveToGitHub(status,'ثبت مسابقه');
       }else{
         const saveBtn=d.getElementById('save');
         if(saveBtn)saveBtn.click();
       }
     },true);
   });
 }
 document.querySelectorAll('.nav button[data-tab]').forEach(btn=>{
   btn.onclick=()=>{const target=d.querySelector('.tab[data-tab="'+btn.dataset.tab+'"]');if(target){target.click();setActive(btn);closeMenu();}}
 });
 document.querySelectorAll('.nav button[data-section]').forEach(btn=>{btn.onclick=()=>{const el=d.getElementById('registrationList')||d.getElementById('registrationsList');if(el)el.scrollIntoView({behavior:'smooth'});closeMenu()}});
 const observer=new MutationObserver(()=>{syncActive();tidyMatches();bindMatchSaveButtons()});const tabs=d.querySelector('.tabs');if(tabs)observer.observe(tabs,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
 const list=d.getElementById('matchesList');if(list){new MutationObserver(()=>{tidyMatches();bindMatchSaveButtons()}).observe(list,{subtree:true,childList:true});}
 bindMatchSaveButtons();
 tidyMatches();syncActive();
}
function setActive(btn){document.querySelectorAll('.nav button[data-tab]').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function syncActive(){const d=frame.contentDocument;if(!d)return;const active=d.querySelector('.tab.active');if(active){const b=document.querySelector('.nav button[data-tab="'+active.dataset.tab+'"]');if(b)setActive(b)}}
frame.addEventListener('load',()=>setTimeout(enhanceLegacy,50));
</script>
</body>
</html>
